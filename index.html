<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NovelAI · Stable Diffusion · ComfyUI 이미지의 프롬프트와 생성 설정을 긍정/부정/캐릭터별로 나눠 보여 주는 메타데이터 뷰어">
<title>이미지 메타데이터 뷰어</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel2: #f0f2f5; --text: #1b1f24; --muted: #5f6b7a; --border: #dde1e6;
  --accent: #4f6bed; --accent-soft: #e8ecfd;
  --pos: #1f8a5b; --pos-soft: #e6f5ee; --neg: #c2410c; --neg-soft: #fdefe7;
  --hw: #b45309; --hb: #4f6bed; --up-soft: #e8ecfd; --down-soft: #eef0f3;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
  --checker: #e9ebee;
  --hit: #d4a017; --hit-soft: #fdf3c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f25; --panel2: #23272e; --text: #e6e8eb; --muted: #9aa4b1; --border: #2e333b;
    --accent: #8197ff; --accent-soft: #252c47;
    --pos: #4cc38a; --pos-soft: #1b2e25; --neg: #f08a5d; --neg-soft: #33231b;
    --hw: #f5b45a; --hb: #8fa2ff; --up-soft: #252c47; --down-soft: #262a31;
    --shadow: none; --checker: #262a31;
    --hit: #e6c14a; --hit-soft: #3d3418;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f25; --panel2: #23272e; --text: #e6e8eb; --muted: #9aa4b1; --border: #2e333b;
  --accent: #8197ff; --accent-soft: #252c47;
  --pos: #4cc38a; --pos-soft: #1b2e25; --neg: #f08a5d; --neg-soft: #33231b;
  --hw: #f5b45a; --hb: #8fa2ff; --up-soft: #252c47; --down-soft: #262a31;
  --shadow: none; --checker: #262a31;
  --hit: #e6c14a; --hit-soft: #3d3418;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
.mono, pre, .ptext { font-family: ui-monospace, "Cascadia Code", Consolas, "D2Coding", monospace; }

header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; margin: 0; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 2px 10px; font-size: 12px; border-radius: 6px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

:root { --thumb: 64px; }
#stripWrap { display: none; background: var(--panel); border-bottom: 1px solid var(--border); }
#stripWrap.show { display: block; }
#strip { display: flex; gap: 8px; padding: 10px 20px 4px; overflow-x: auto; scroll-behavior: smooth; }
.thumb {
  position: relative; flex: 0 0 auto; height: var(--thumb); min-width: calc(var(--thumb) * .5); border-radius: 8px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent; background: var(--checker); padding: 0;
}
.thumb img { height: 100%; width: auto; max-width: calc(var(--thumb) * 2); object-fit: cover; display: block; }
.thumb.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.thumb .tb, .thumb .no { position: absolute; font-size: 10px; line-height: 1; padding: 3px 4px; border-radius: 4px; background: rgba(0,0,0,.65); color: #fff; }
.thumb .tb { left: 3px; bottom: 3px; }
.thumb .no { right: 3px; top: 3px; }
.thumb.active .no { background: var(--accent); }
/* 메타데이터 없는 이미지는 흐리게 + 붉은 표시 */
.thumb .tb.none { background: var(--neg); color: var(--panel); font-weight: 700; }
.thumb.nometa { border-style: dashed; border-color: var(--neg); }
.thumb.nometa img { opacity: .5; filter: grayscale(.7); }
.thumb.nometa.active { border-style: solid; }
.thumb.nometa.active img { opacity: .85; }
/* 상단 도구 줄: 태그 검색 · 태그 비교 */
#tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 20px 0; }
.qbox { position: relative; flex: 1 1 240px; max-width: 460px; }
#q {
  width: 100%; border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 6px 30px 6px 30px; font: inherit;
}
#q:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.qbox::before { content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 16px; pointer-events: none; }
#qClear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 6px; }
#qCount { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tgroup { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
#btnFavOnly[aria-pressed="true"] { border-color: var(--hit); background: var(--hit-soft); color: var(--text); }
/* 내보내기 메뉴 */
details.menu { position: relative; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu[open] > summary { border-color: var(--accent); }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px; padding: 6px;
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14);
}
.menu-pop button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu-pop button:hover { background: var(--panel2); }
.menu-note { margin: 4px 10px 2px; font-size: 11.5px; color: var(--muted); }
/* 태그 통계 */
#statsPanel { padding: 8px 20px 0; }
.stats-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.stats-head b { color: var(--text); font-size: 13px; }
.stats-head .seg { display: inline-flex; gap: 4px; }
.stats-hint { margin-left: auto; }
.stats-chips { max-height: 168px; overflow-y: auto; padding: 8px 0 4px; }
.chip.stat { background: linear-gradient(90deg, var(--accent-soft) var(--p), var(--panel2) var(--p)); }
.chip.stat.on { box-shadow: 0 0 0 2px var(--hit); }
.sn { margin-left: 6px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
/* 썸네일 즐겨찾기 · 미리보기 말풍선 */
.thumb .fv { position: absolute; right: 3px; bottom: 2px; font-size: 14px; line-height: 1; color: #f5c518; text-shadow: 0 0 3px rgba(0,0,0,.85); }
#tip {
  position: fixed; z-index: 35; width: max-content; max-width: min(400px, calc(100vw - 16px)); padding: 10px 12px; pointer-events: none;
  background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16);
  font-size: 12px; line-height: 1.55;
}
#tip p { margin: 6px 0 0; word-break: break-word; }
#tip .tk { color: var(--muted); }
#tip .tnm { color: var(--neg); font-weight: 700; }
#tip .tl { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: 700; }
#tip .tl.p { background: var(--pos-soft); color: var(--pos); }
#tip .tl.n { background: var(--neg-soft); color: var(--neg); }
.pactions { display: flex; gap: 6px; margin-top: 8px; }
.favbtn[aria-pressed="true"] { border-color: var(--hit); background: var(--hit-soft); color: var(--text); }
.kv.hit { box-shadow: inset 0 0 0 2px var(--hit); }
/* 태그 합성 */
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.compose { position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow-y: auto; }
.compose .empty-note { padding: 10px 14px 0; }
.csec { padding-bottom: 10px; }
.csec + .csec { border-top: 1px solid var(--border); }
.csec .chips { padding-top: 6px; padding-bottom: 0; }
.ctag { display: inline-flex; align-items: center; cursor: default; }
.ctag .x { border: 0; background: none; margin: 0 -4px 0 4px; padding: 0 4px; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
.ctag .x:hover { color: var(--neg); }
.cin {
  display: block; width: calc(100% - 28px); margin: 8px 14px 0; padding: 5px 8px; font: inherit; font-size: 12.5px;
  border: 1px dashed var(--border); border-radius: 6px; background: var(--panel); color: var(--text);
}
.cin:focus { outline: 2px solid var(--accent-soft); border-style: solid; border-color: var(--accent); }
.wpick {
  margin-left: 6px; padding: 0 5px; border: 1px solid var(--hit); border-radius: 4px; background: var(--panel); cursor: pointer;
  font: 700 11px ui-monospace, Consolas, monospace; color: var(--hw);
}
.wpick:hover { background: var(--hit-soft); }
.cimg img { cursor: zoom-in; }
mark.q { background: var(--hit-soft); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px var(--hit); }
.chip.hit { box-shadow: 0 0 0 2px var(--hit); }
.thumb.cmpB { border-color: var(--pos); box-shadow: 0 0 0 2px var(--pos-soft); }
.thumb[data-ab="A"]::after, .thumb[data-ab="B"]::after {
  content: attr(data-ab); position: absolute; left: 3px; top: 3px; padding: 3px 5px; border-radius: 4px;
  font: 700 11px/1 system-ui, sans-serif; color: var(--panel); background: var(--accent);
}
.thumb[data-ab="B"]::after { background: var(--pos); }

/* 태그 비교 화면 */
.cmp { display: flex; flex-direction: column; gap: 14px; }
.chead { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.cside { position: relative; min-width: 0; }
.cimg { background: var(--checker); border-radius: 10px; overflow: hidden; border: 2px solid var(--accent); }
.cside.b .cimg { border-color: var(--pos); }
.cimg.nometa { border-style: dashed; border-color: var(--neg); }
.cimg img { display: block; width: 100%; height: 240px; object-fit: contain; }
.cside .ab { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; color: var(--panel); background: var(--accent); }
.cside.b .ab { background: var(--pos); }
.cname { margin-top: 6px; font-size: 12px; color: var(--muted); word-break: break-all; }
.cname .nm { color: var(--neg); }
.cbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.cbar .btn { margin-left: auto; color: var(--text); }
.drow + .drow { border-top: 1px solid var(--border); }
.dlabel { display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; font-size: 12px; font-weight: 700; }
.dlabel .dn { font-weight: 400; color: var(--muted); }
.dlabel .btn { margin-left: auto; font-weight: 400; color: var(--text); }
.dlabel .btn + .btn { margin-left: 0; }
.drow.add .dlabel { color: var(--pos); }
.drow.del .dlabel { color: var(--neg); }
.drow.chg .dlabel { color: var(--hw); }
.chip.add { background: var(--pos-soft); border-color: var(--pos); }
.chip.del { background: var(--neg-soft); border-color: var(--neg); text-decoration: line-through; }
.chip.chg { background: var(--hit-soft); border-color: var(--hit); }
.cw { margin-left: 4px; font: 700 11px ui-monospace, Consolas, monospace; color: var(--hw); }
.dsame { border-top: 1px solid var(--border); }
.dsame > summary { cursor: pointer; padding: 8px 14px; font-size: 12px; color: var(--muted); }
.dtable th, .dtable td { font-variant-numeric: tabular-nums; }
.dtable tr:first-child th { color: var(--muted); }

#stripHandle {
  position: relative; height: 14px; cursor: ns-resize; touch-action: none; user-select: none;
  display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 10.5px;
}
#stripHandle::before { content: ""; width: 44px; height: 4px; border-radius: 2px; background: var(--border); transition: background .15s; }
#stripHandle:hover::before, #stripHandle.dragging::before { background: var(--accent); }
#stripHandle span { position: absolute; right: 20px; opacity: 0; transition: opacity .15s; }
#stripHandle:hover span, #stripHandle.dragging span { opacity: 1; }

main { max-width: 1400px; margin: 0 auto; padding: 20px; }
.foot { max-width: 1400px; margin: 0 auto; padding: 4px 20px 28px; color: var(--muted); font-size: 12px; text-align: center; }
.foot a { color: inherit; }
.foot a:hover { color: var(--accent); }
.drop {
  border: 2px dashed var(--border); border-radius: 16px; padding: 64px 24px; text-align: center; cursor: pointer;
  background: var(--panel); transition: border-color .15s, background .15s;
}
.drop:hover { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { margin: 0 0 8px; font-size: 18px; }
.drop p { margin: 4px 0; color: var(--muted); }
.drop .formats { margin-top: 16px; font-size: 12px; }

#overlay {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
  background: rgba(79,107,237,.18); backdrop-filter: blur(2px);
}
#overlay.show { display: flex; }
#overlay div { background: var(--panel); border: 2px dashed var(--accent); border-radius: 16px; padding: 32px 48px; font-size: 18px; font-weight: 600; }

.layout { display: grid; grid-template-columns: minmax(260px, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
.preview { position: sticky; top: 76px; }
.preview .imgbox {
  background-color: var(--checker);
  background-image: linear-gradient(45deg, var(--panel2) 25%, transparent 25%, transparent 75%, var(--panel2) 75%),
                    linear-gradient(45deg, var(--panel2) 25%, transparent 25%, transparent 75%, var(--panel2) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px;
  border-radius: 12px; overflow: hidden; border: 1px solid var(--border); position: relative;
}
.preview .imgbox.nometa { border: 2px dashed var(--neg); }
.nometa-flag {
  position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 6px; pointer-events: none;
  background: var(--neg); color: var(--panel); font-size: 12px; font-weight: 700;
}
.fileinfo .zip { display: block; margin-top: 2px; }
.preview img { display: block; width: 100%; max-height: 70vh; object-fit: contain; cursor: zoom-in; }
.fileinfo { margin-top: 10px; font-size: 12px; color: var(--muted); word-break: break-all; }
.fileinfo b { color: var(--text); font-size: 13px; display: block; margin-bottom: 2px; }

.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel2); border: 1px solid var(--border); }
.badge.gen { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.none { color: var(--muted); }
.badge.refb { background: var(--hit-soft); border-color: transparent; }
.rtable th { width: 130px; }
.rstat { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--panel2); color: var(--muted); }
.rstat.on { background: var(--accent-soft); color: var(--accent); }
.rline { margin-top: 4px; font-variant-numeric: tabular-nums; }
.rline .muted { color: var(--muted); }
.toolbar { margin-left: auto; display: flex; gap: 6px; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-head h3 { margin: 0; font-size: 14px; font-weight: 700; }
.card-head .count { color: var(--muted); font-size: 12px; margin-left: auto; }
.card-head .count + .btn { margin-left: 0; }
.card-body { padding: 12px 14px; }
.prompt.pos { border-left: 4px solid var(--pos); }
.prompt.pos .card-head h3 { color: var(--pos); }
.prompt.neg { border-left: 4px solid var(--neg); }
.prompt.neg .card-head h3 { color: var(--neg); }
.ptext { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.7; padding: 12px 14px; }
.hw { color: var(--hw); font-weight: 700; }
.hb { color: var(--hb); font-weight: 700; }
.empty-note { color: var(--muted); padding: 10px 14px; margin: 0; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
.chip {
  font-size: 12.5px; padding: 2px 9px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--border);
  cursor: pointer; word-break: break-word; text-align: left;
}
.chip:hover { border-color: var(--accent); }
.chip.up { background: var(--up-soft); border-color: transparent; }
.chip.down { background: var(--down-soft); color: var(--muted); border-style: dashed; }
.chip.minus { background: var(--neg-soft); border-color: var(--neg); border-style: dashed; }
/* 여러 태그를 묶는 가중치 그룹: 3::태그1, 태그2:: / {{태그1, 태그2}} */
.grp {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 100%;
  padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2);
}
.grp.up { background: var(--up-soft); border-color: var(--hb); }
.grp.down { background: var(--down-soft); border-style: dashed; }
.grp.minus { background: var(--neg-soft); border-color: var(--neg); border-style: dashed; }
.grp .chip { background: var(--panel); }
.glabel {
  border: 0; background: none; padding: 0 2px; cursor: pointer; font: 700 12px/1.6 ui-monospace, Consolas, monospace; color: var(--hw);
}
.grp.minus > .glabel { color: var(--neg); }
.glabel:hover { text-decoration: underline; }
.rw { border-radius: 4px; padding: 1px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.rw.up { background: var(--up-soft); }
.rw.down { background: var(--down-soft); }
.rw.minus { background: var(--neg-soft); }

.sel { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 8px; font: inherit; cursor: pointer; }

/* 확대 보기 */
#viewer { position: fixed; inset: 0; z-index: 40; background: #0e1014; color: #e6e8eb; display: flex; flex-direction: column; }
#viewer[hidden] { display: none; }
.vbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,.4); flex-wrap: wrap; }
.vbar .name { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbar .zoom { font: 12px ui-monospace, Consolas, monospace; min-width: 52px; text-align: right; opacity: .8; }
.vbtn { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #e6e8eb; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.vbtn:hover { background: rgba(255,255,255,.16); }
#vStage { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; }
#vStage.drag { cursor: grabbing; }
#vImg { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; max-width: none; }
#vImg.px { image-rendering: pixelated; }
.vnav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 72px; border: 0; border-radius: 8px;
  background: rgba(0,0,0,.35); color: #fff; font-size: 28px; cursor: pointer; z-index: 1;
}
.vnav:hover { background: rgba(0,0,0,.6); }
.vnav.prev { left: 10px; } .vnav.next { right: 10px; }
.vnav[disabled] { opacity: .2; cursor: default; }
.vhint { padding: 6px 12px; font-size: 11.5px; opacity: .6; text-align: center; }

.chars-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chars-head h2 { margin: 0; font-size: 15px; }
.chars-head .meta { color: var(--muted); font-size: 12px; }
.char { border-left: 4px solid var(--cc); }
.char .card-head h3 { color: var(--cc); }
.char .sub { border-top: 1px solid var(--border); }
.char .sub:first-of-type { border-top: 0; }
.char .sublabel { display: flex; align-items: center; gap: 8px; padding: 8px 14px 0; font-size: 12px; font-weight: 700; }
.char .sublabel.p { color: var(--pos); }
.char .sublabel.n { color: var(--neg); }

<script>
'use strict';

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const utf8 = (u8, fatal = false) => new TextDecoder('utf-8', { fatal }).decode(u8);
const latin1 = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return s; };
const smartText = u8 => { try { return utf8(u8, true); } catch { return latin1(u8); } };
const ascii = (u8, p, n) => latin1(u8.subarray(p, p + n));
const fmtBytes = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
const tryJSON = s => { if (typeof s !== 'string') return null; const t = s.trim(); if (!/^[{[]/.test(t)) return null; try { return JSON.parse(t); } catch { return null; } };
const pretty = s => { const j = tryJSON(s); return j ? JSON.stringify(j, null, 2) : s; };

async function inflate(u8, format) {
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream(format));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* 복사 버튼에 연결할 텍스트를 렌더링마다 모아 둠 */
let clips = [];
const clip = text => { clips.push(String(text ?? '')); return clips.length - 1; };

function toast(msg, ms = 1400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('복사했습니다');
}

/* ---------- PNG ---------- */
async function parsePNG(u8, res) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let p = 8;
  while (p + 12 <= u8.length) {
    const len = dv.getUint32(p), type = ascii(u8, p + 4, 4);
    const data = u8.subarray(p + 8, p + 8 + len);
    res.chunks.push(type);
    try {
      if (type === 'tEXt') {
        const z = data.indexOf(0);
        res.texts.push({ key: latin1(data.subarray(0, z)), text: smartText(data.subarray(z + 1)), chunk: 'tEXt' });
      } else if (type === 'zTXt') {
        const z = data.indexOf(0);
        res.texts.push({ key: latin1(data.subarray(0, z)), text: smartText(await inflate(data.subarray(z + 2), 'deflate')), chunk: 'zTXt' });
      } else if (type === 'iTXt') {
        const z = data.indexOf(0);
        const key = latin1(data.subarray(0, z));
        const compressed = data[z + 1];
        let q = z + 3;
        const langEnd = data.indexOf(0, q); q = langEnd + 1;
        const transEnd = data.indexOf(0, q); q = transEnd + 1;
        let body = data.subarray(q);
        if (compressed) body = await inflate(body, 'deflate');
        res.texts.push({ key, text: utf8(body), chunk: 'iTXt' });
      } else if (type === 'eXIf') {
        res.exif = parseTIFF(data);
      } else if (type === 'IEND') break;
    } catch (e) { res.errors.push(`${type} 청크 해석 실패: ${e.message}`); }
    p += 12 + len;
  }
}

/* ---------- JPEG ---------- */
function parseJPEG(u8, res) {
  let p = 2;
  while (p + 4 <= u8.length) {
    if (u8[p] !== 0xFF) { p++; continue; }
    const m = u8[p + 1];
    if (m === 0xFF) { p++; continue; }
    if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { p += 2; continue; }
    if (m === 0xDA || m === 0xD9) break;
    const L = (u8[p + 2] << 8) | u8[p + 3];
    const seg = u8.subarray(p + 4, p + 2 + L);
    try {
      if (m === 0xE1 && ascii(seg, 0, 6) === 'Exif\0\0') res.exif = parseTIFF(seg.subarray(6));
      else if (m === 0xE1 && ascii(seg, 0, 29) === 'http://ns.adobe.com/xap/1.0/\0') res.xmp = utf8(seg.subarray(29));
      else if (m === 0xFE) res.texts.push({ key: 'Comment', text: smartText(seg), chunk: 'JPEG COM' });
    } catch (e) { res.errors.push(`JPEG 세그먼트 해석 실패: ${e.message}`); }
    p += 2 + L;
  }
}

/* ---------- WebP ---------- */
function parseWebP(u8, res) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let p = 12;
  while (p + 8 <= u8.length) {
    const type = ascii(u8, p, 4), size = dv.getUint32(p + 4, true);
    let data = u8.subarray(p + 8, p + 8 + size);
    res.chunks.push(type.trim());
    try {
      if (type === 'EXIF') {
        if (ascii(data, 0, 6) === 'Exif\0\0') data = data.subarray(6);
        res.exif = parseTIFF(data);
      } else if (type === 'XMP ') res.xmp = utf8(data);
    } catch (e) { res.errors.push(`WebP ${type} 해석 실패: ${e.message}`); }
    p += 8 + size + (size & 1);
  }
}

/* ---------- EXIF (TIFF) ---------- */
const TAGS = {
  IFD0: { 0x010E: 'ImageDescription', 0x010F: 'Make', 0x0110: 'Model', 0x0112: 'Orientation', 0x011A: 'XResolution', 0x011B: 'YResolution',
    0x0128: 'ResolutionUnit', 0x0131: 'Software', 0x0132: 'DateTime', 0x013B: 'Artist', 0x8298: 'Copyright',
    0x9C9B: 'XPTitle', 0x9C9C: 'XPComment', 0x9C9D: 'XPAuthor', 0x9C9E: 'XPKeywords', 0x9C9F: 'XPSubject' },
  Exif: { 0x829A: 'ExposureTime', 0x829D: 'FNumber', 0x8822: 'ExposureProgram', 0x8827: 'ISO', 0x9000: 'ExifVersion',
    0x9003: 'DateTimeOriginal', 0x9004: 'DateTimeDigitized', 0x9010: 'OffsetTime', 0x9201: 'ShutterSpeedValue', 0x9202: 'ApertureValue',
    0x9204: 'ExposureBias', 0x9207: 'MeteringMode', 0x9209: 'Flash', 0x920A: 'FocalLength', 0x9286: 'UserComment',
    0xA001: 'ColorSpace', 0xA002: 'PixelXDimension', 0xA003: 'PixelYDimension', 0xA405: 'FocalLengthIn35mm',
    0xA420: 'ImageUniqueID', 0xA433: 'LensMake', 0xA434: 'LensModel', 0x927C: 'MakerNote' },
  GPS: { 0x0000: 'GPSVersionID', 0x0001: 'GPSLatitudeRef', 0x0002: 'GPSLatitude', 0x0003: 'GPSLongitudeRef', 0x0004: 'GPSLongitude',
    0x0005: 'GPSAltitudeRef', 0x0006: 'GPSAltitude', 0x0007: 'GPSTimeStamp', 0x001D: 'GPSDateStamp' },
};
const TYPE_SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 6: 1, 7: 1, 8: 2, 9: 4, 10: 8, 11: 4, 12: 8 };

function parseTIFF(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const le = u8[0] === 0x49;
  const g16 = o => dv.getUint16(o, le), g32 = o => dv.getUint32(o, le);
  if (g16(2) !== 42) throw new Error('TIFF 헤더가 아닙니다');
  const out = [], seen = new Set();
  const readVal = (type, count, o) => {
    if (type === 2) return smartText(u8.subarray(o, o + count)).replace(/\0+$/, '');
    if (type === 1 || type === 7 || type === 6) return u8.slice(o, o + count);
    const vals = [];
    for (let i = 0; i < count; i++) {
      const q = o + i * TYPE_SIZE[type];
      if (type === 3) vals.push(g16(q));
      else if (type === 4) vals.push(g32(q));
      else if (type === 9) vals.push(dv.getInt32(q, le));
      else if (type === 8) vals.push(dv.getInt16(q, le));
      else if (type === 5) vals.push([g32(q), g32(q + 4)]);
      else if (type === 10) vals.push([dv.getInt32(q, le), dv.getInt32(q + 4, le)]);
      else if (type === 11) vals.push(dv.getFloat32(q, le));
      else if (type === 12) vals.push(dv.getFloat64(q, le));
    }
    return count === 1 ? vals[0] : vals;
  };
  const readIFD = (off, ifd) => {
    if (seen.has(off) || off < 8 || off + 2 > u8.length) return;
    seen.add(off);
    const n = g16(off);
    for (let i = 0; i < n; i++) {
      const e = off + 2 + i * 12;
      if (e + 12 > u8.length) break;
      const tag = g16(e), type = g16(e + 2), count = g32(e + 4);
      const bytes = (TYPE_SIZE[type] || 1) * count;
      if (tag === 0x8769) { readIFD(g32(e + 8), 'Exif'); continue; }
      if (tag === 0x8825) { readIFD(g32(e + 8), 'GPS'); continue; }
      if (tag === 0xA005) continue;
      const vo = bytes <= 4 ? e + 8 : g32(e + 8);
      if (vo + bytes > u8.length) continue;
      out.push({ ifd, tag, name: TAGS[ifd]?.[tag] || `0x${tag.toString(16).padStart(4, '0')}`, value: readVal(type, count, vo) });
    }
  };
  readIFD(g32(4), 'IFD0');
  return out;
}

function decodeUserComment(b) {
  const head = latin1(b.subarray(0, 8)), body = b.subarray(8);
  if (head.startsWith('UNICODE')) {
    let be = body.length > 1 && body[0] === 0 && body[1] !== 0;
    if (!be && !(body[0] !== 0 && body[1] === 0)) be = true;
    return new TextDecoder(be ? 'utf-16be' : 'utf-16le').decode(body).replace(/\0+$/, '');
  }
  if (head.startsWith('ASCII') || head === '\0\0\0\0\0\0\0\0') return smartText(body).replace(/\0+$/, '');
  return smartText(b).replace(/\0+$/, '');
}
function fmtExif(e) {
  const v = e.value;
  if (e.name === 'UserComment' && v instanceof Uint8Array) return decodeUserComment(v);
  if (e.name.startsWith('XP') && v instanceof Uint8Array) return new TextDecoder('utf-16le').decode(v).replace(/\0+$/, '');
  if (v instanceof Uint8Array) {
    if (v.length <= 16) return Array.from(v, x => x.toString(16).padStart(2, '0')).join(' ');
    return `(바이너리 ${v.length} 바이트)`;
  }
  const r = x => Array.isArray(x) ? (e.name === 'ExposureTime' && x[0] === 1 ? `1/${x[1]}` : x[1] ? +(x[0] / x[1]).toFixed(4) : 0) : x;
  if (Array.isArray(v) && !Array.isArray(v[0]) && v.length === 2 && (e.name.endsWith('Resolution') || /Time$|FNumber|FocalLength|Altitude|Value|Bias/.test(e.name))) return String(r(v));
  if (Array.isArray(v)) return v.map(r).join(', ');
  return String(v);
}
function gpsDecimal(exif) {
  const g = n => exif.find(e => e.ifd === 'GPS' && e.name === n)?.value;
  const lat = g('GPSLatitude'), lon = g('GPSLongitude');
  if (!Array.isArray(lat) || !Array.isArray(lon)) return null;
  const dms = a => a.reduce((s, x, i) => s + (x[1] ? x[0] / x[1] : 0) / Math.pow(60, i), 0);
  const la = dms(lat) * (g('GPSLatitudeRef') === 'S' ? -1 : 1), lo = dms(lon) * (g('GPSLongitudeRef') === 'W' ? -1 : 1);
  return `${la.toFixed(6)}, ${lo.toFixed(6)}`;
}

/* ---------- 스텔스 정보 (알파/RGB 채널 LSB에 숨겨진 데이터, NovelAI 등) ---------- */
async function readStealth(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' }); }
  catch { bmp = await createImageBitmap(file); }
  const w = bmp.width, h = bmp.height;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  bmp.close?.();
  const px = ctx.getImageData(0, 0, w, h).data;
  const total = w * h;
  // 픽셀은 열 우선(x 바깥, y 안쪽) 순서로 읽음
  const readA = i => { const x = (i / h) | 0, y = i % h; return px[(y * w + x) * 4 + 3] & 1; };
  const readRGB = i => { const p = (i / 3) | 0, ch = i % 3, x = (p / h) | 0, y = p % h; return px[(y * w + x) * 4 + ch] & 1; };
  const modes = [
    { reader: readA, cap: total, magics: { stealth_pnginfo: false, stealth_pngcomp: true }, label: '알파 채널' },
    { reader: readRGB, cap: total * 3, magics: { stealth_rgbinfo: false, stealth_rgbcomp: true }, label: 'RGB 채널' },
  ];
  for (const m of modes) {
    if (m.cap < 152) continue;
    const bytes = (start, n) => {
      const out = new Uint8Array(n);
      for (let i = 0; i < n; i++) { let b = 0; for (let k = 0; k < 8; k++) b = (b << 1) | m.reader(start + i * 8 + k); out[i] = b; }
      return out;
    };
    const magic = latin1(bytes(0, 15));
    if (!(magic in m.magics)) continue;
    const lb = bytes(120, 4);
    const lenBits = ((lb[0] << 24) | (lb[1] << 16) | (lb[2] << 8) | lb[3]) >>> 0;
    if (!lenBits || 152 + lenBits > m.cap) return { width: w, height: h, stealth: { error: '스텔스 데이터 길이가 올바르지 않습니다', magic } };
    let payload = bytes(152, lenBits >> 3);
    if (m.magics[magic]) payload = await inflate(payload, 'gzip');
    const text = utf8(payload);
    return { width: w, height: h, stealth: { magic, label: m.label, text, json: tryJSON(text) } };
  }
  return { width: w, height: h, stealth: null };
}

/* ---------- 분석 ---------- */
async function analyze(file) {
  const u8 = new Uint8Array(await file.arrayBuffer());
  const res = { format: '알 수 없음', width: 0, height: 0, texts: [], chunks: [], exif: null, xmp: null, stealth: null, errors: [] };
  try {
    if (u8[0] === 0x89 && ascii(u8, 1, 3) === 'PNG') { res.format = 'PNG'; await parsePNG(u8, res); }
    else if (u8[0] === 0xFF && u8[1] === 0xD8) { res.format = 'JPEG'; parseJPEG(u8, res); }
    else if (ascii(u8, 0, 4) === 'RIFF' && ascii(u8, 8, 4) === 'WEBP') { res.format = 'WebP'; parseWebP(u8, res); }
    else if (ascii(u8, 0, 3) === 'GIF') res.format = 'GIF';
    else if (ascii(u8, 4, 8) === 'ftypavif') res.format = 'AVIF';
  } catch (e) { res.errors.push('파일 구조 해석 실패: ' + e.message); }
  try {
    const st = await readStealth(file);
    res.width = st.width; res.height = st.height;
    if (res.format === 'PNG' || res.format === 'WebP') res.stealth = st.stealth;
  } catch (e) { res.errors.push('이미지 디코딩 실패: ' + e.message); }
  if (res.exif) {
    const uc = res.exif.find(e => e.name === 'UserComment');
    if (uc) res.userComment = fmtExif(uc);
  }
  res.gen = interpret(res);
  return res;
}

function interpret(res) {
  const t = {};
  for (const x of res.texts) if (!(x.key in t)) t[x.key] = x.text;

  // NovelAI
  const isNAI = f => f && (f.Software === 'NovelAI' || /NovelAI/i.test(f.Source || '') || /NovelAI|^AI generated image/i.test(f.Title || '')
    || (() => { const c = typeof f.Comment === 'string' ? tryJSON(f.Comment) : f.Comment; return !!(c && ('uc' in c || 'v4_prompt' in c)); })());
  let fields = null, origin = '';
  if (isNAI(t)) { fields = t; origin = 'PNG 텍스트 청크'; }
  else if (res.stealth?.json && isNAI(res.stealth.json)) { fields = res.stealth.json; origin = `스텔스 정보 (${res.stealth.label})`; }
  if (fields) { const nai = parseNAI(fields); if (nai) return { kind: 'nai', origin, ...nai }; }

  // Stable Diffusion WebUI (A1111 / Forge)
  const sdText = t.parameters
    || (res.userComment && /Steps:\s*\d+/.test(res.userComment) ? res.userComment : null)
    || (res.stealth && !res.stealth.json && /Steps:\s*\d+/.test(res.stealth.text || '') ? res.stealth.text : null);
  if (sdText) return { kind: 'a1111', origin: t.parameters ? 'PNG 텍스트 청크 (parameters)' : res.userComment === sdText ? 'EXIF UserComment' : `스텔스 정보 (${res.stealth.label})`, ...parseA1111(sdText) };

  // ComfyUI
  const comfy = tryJSON(t.prompt);
  if (comfy && typeof comfy === 'object' && Object.values(comfy).some(n => n && n.class_type)) return { kind: 'comfy', origin: 'PNG 텍스트 청크 (prompt)', ...parseComfy(comfy) };

  return null;
}

const SAMPLERS = {
  k_euler: 'Euler', k_euler_ancestral: 'Euler Ancestral', k_dpmpp_2s_ancestral: 'DPM++ 2S Ancestral', k_dpmpp_2m: 'DPM++ 2M',
  k_dpmpp_2m_sde: 'DPM++ 2M SDE', k_dpmpp_sde: 'DPM++ SDE', k_dpm_2: 'DPM2', k_dpm_2_ancestral: 'DPM2 Ancestral',
  k_dpm_fast: 'DPM Fast', k_dpm_adaptive: 'DPM Adaptive', k_lms: 'LMS', ddim: 'DDIM', ddim_v3: 'DDIM', plms: 'PLMS',
};

/* NAI 레퍼런스: 바이브 트랜스퍼, 캐릭터 레퍼런스(V4.5), img2img · 인페인트
   - 바이브 정보 추출 값은 V4 이후 메타데이터에 남지 않음 (빈 배열)
   - 캐릭터 레퍼런스 Fidelity = 1 - director_reference_secondary_strengths */
function naiRefs(c) {
  const arr = v => Array.isArray(v) ? v : [];
  const vs = arr(c.reference_strength_multiple), vi = arr(c.reference_information_extracted_multiple), vd = arr(c.reference_image_multiple);
  const vibes = Array.from({ length: Math.max(vs.length, vd.length) }, (_, i) => ({
    strength: vs[i], info: vi[i], bytes: typeof vd[i] === 'string' ? Math.round(vd[i].length * 3 / 4) : 0,
  }));
  const ds = arr(c.director_reference_strengths), dd = arr(c.director_reference_descriptions);
  const d2 = arr(c.director_reference_secondary_strengths), di = arr(c.director_reference_information_extracted);
  const chars = Array.from({ length: Math.max(ds.length, dd.length, arr(c.director_references).length) }, (_, i) => ({
    type: dd[i]?.caption?.base_caption ?? '', strength: ds[i], info: di[i],
    fidelity: typeof d2[i] === 'number' ? Math.round((1 - d2[i]) * 1000) / 1000 : undefined,
  }));
  const rt = c.request_type || '';
  const input = /img2img/i.test(rt) ? 'img2img' : /infill|inpaint/i.test(rt) ? '인페인트' : c.image ? 'img2img' : '';
  return { vibes, chars, input, strength: c.strength, noise: c.noise };
}
const REF_TYPE = { 'character&style': '캐릭터 + 스타일', character: '캐릭터', style: '스타일' };
const refList = r => [
  r.vibes.length && `바이브 ${r.vibes.length}`,
  r.chars.length && (r.chars.length > 1 ? `캐릭터 레퍼런스 ${r.chars.length}` : '캐릭터 레퍼런스'),
  r.input,
].filter(Boolean);
const refText = g => g?.refs ? (refList(g.refs).join(' · ') || '사용 안 함') : '';
// 모델 해시로 알 수 있는 정보: Full / Curated, V5 Full은 Effort마다 해시가 다름
const MODEL_HASHES = {
  '0ADF9AB7': { variant: 'Full', effort: 'High' },     // V5
  '70AB5786': { variant: 'Full', effort: 'Medium' },   // V5
  'DB276663': { variant: 'Curated' },                  // V5
  'C02D4F98': { variant: 'Curated' },                  // V4.5
  '7ABFFA2A': { variant: 'Curated' },                  // V4
};
const QUALITY_TAGS = { 0: 'None', 1: 'Standard' };
const UC_PRESETS = { 0: 'None', 2: 'Heavy', 3: 'Light', 4: 'Human Focus', 5: 'Furry Focus' };

function parseNAI(f) {
  const c = typeof f.Comment === 'string' ? tryJSON(f.Comment) : f.Comment;
  if (!c || typeof c !== 'object') {
    if (!f.Description) return null;
    return { positive: f.Description, negative: '', chars: [], settings: [['소프트웨어', f.Software || 'NovelAI']], extra: [], model: f.Source || '' };
  }
  const v4p = c.v4_prompt?.caption, v4n = c.v4_negative_prompt?.caption;
  const positive = v4p?.base_caption ?? c.prompt ?? f.Description ?? '';
  const negative = v4n?.base_caption ?? c.uc ?? '';

  let chars = [];
  if (Array.isArray(v4p?.char_captions) && v4p.char_captions.length) {
    chars = v4p.char_captions.map((cc, i) => ({
      positive: cc.char_caption ?? '', negative: v4n?.char_captions?.[i]?.char_caption ?? '', centers: cc.centers || [],
    }));
  } else if (Array.isArray(c.characterPrompts) && c.characterPrompts.length) {
    chars = c.characterPrompts.map(cp => ({ positive: cp.prompt || '', negative: cp.uc || '', centers: cp.center ? [cp.center] : [], enabled: cp.enabled }));
  }

  const used = new Set(['prompt', 'uc', 'v4_prompt', 'v4_negative_prompt', 'characterPrompts', 'width', 'height', 'steps', 'scale',
    'cfg_rescale', 'seed', 'sampler', 'noise_schedule', 'skip_cfg_above_sigma', 'request_type', 'n_samples',
    'model_name', 'model_hash', 'tag_hint_qt', 'tag_hint_uc_preset', 'reference_strength_multiple', 'reference_information_extracted_multiple',
    'reference_image_multiple', 'director_references', 'director_reference_strengths', 'director_reference_descriptions',
    'director_reference_secondary_strengths', 'director_reference_information_extracted', 'director_reference_images']);
  // 모델: Source가 없으면 Comment의 model_name (V5부터). V5는 Effort마다 모델 해시가 다름
  const source = f.Source || [c.model_name, c.model_hash].filter(Boolean).join(' ');
  const hash = (c.model_hash || (source.match(/\b([0-9A-F]{8})$/i) || [])[1] || '').toUpperCase();
  const modelName = c.model_name || source.replace(/\s+[0-9A-F]{8}$/i, '');
  const known = MODEL_HASHES[hash] || {}, effort = known.effort || '';
  const S = [];
  const add = (k, v, raw) => { if (v !== undefined && v !== null && v !== '') S.push([k, String(v), raw]); };
  add('모델', source);
  add('모델 종류', known.variant);
  add('Effort', effort);
  if (c.width && c.height) add('해상도', `${c.width} × ${c.height}`);
  add('스텝', c.steps);
  add('프롬프트 가이던스', c.scale);
  add('가이던스 리스케일', c.cfg_rescale);
  add('시드', c.seed);
  add('샘플러', c.sampler ? (SAMPLERS[c.sampler] ? `${SAMPLERS[c.sampler]}` : c.sampler) : null, c.sampler);
  add('노이즈 스케줄', c.noise_schedule);
  if ('skip_cfg_above_sigma' in c) add('Variety+', c.skip_cfg_above_sigma != null ? '켜짐' : '꺼짐');
  if ('sm' in c && !c.v4_prompt) { add('SMEA', c.sm ? (c.sm_dyn ? 'SMEA + DYN' : 'SMEA') : '꺼짐'); used.add('sm'); used.add('sm_dyn'); }
  if (/img2img|inpaint/i.test(c.request_type || '') || c.image) {
    add('img2img 강도', c.strength); add('img2img 노이즈', c.noise); used.add('strength'); used.add('noise');
  }
  if (c.tag_hint_qt != null) add('품질 태그', QUALITY_TAGS[c.tag_hint_qt] ?? `${c.tag_hint_qt}번`);
  if (c.tag_hint_uc_preset != null) add('UC 프리셋', UC_PRESETS[c.tag_hint_uc_preset] ?? `${c.tag_hint_uc_preset}번`);
  add('요청 유형', c.request_type);
  if (f['Generation time']) add('생성 소요 시간', `${(+f['Generation time']).toFixed(2)}초`, f['Generation time']);
  if (f.Software && f.Software !== 'NovelAI') add('소프트웨어', f.Software);

  const extra = Object.entries(c).filter(([k]) => !used.has(k));
  return {
    positive, negative, chars, settings: S, extra, refs: naiRefs(c),
    useCoords: c.v4_prompt?.use_coords ?? c.use_coords, useOrder: c.v4_prompt?.use_order,
    model: modelName + (known.variant ? ` ${known.variant}` : '') + (effort ? ` · Effort ${effort}` : ''), comment: c,
  };
}

function parseA1111(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  let paramLine = '';
  for (let i = lines.length - 1; i >= 0; i--) {
    if (/^\s*Steps:\s*\d+/.test(lines[i])) { paramLine = lines.splice(i).join(', '); break; }
  }
  let pos = lines, neg = [];
  const ni = lines.findIndex(l => l.startsWith('Negative prompt:'));
  if (ni >= 0) { pos = lines.slice(0, ni); neg = lines.slice(ni); neg[0] = neg[0].replace(/^Negative prompt:\s*/, ''); }
  const settings = [];
  const re = /\s*([^:,]+?):\s*("(?:\\.|[^\\"])*"|[^,]*)(?:,|$)/g;
  let m;
  while ((m = re.exec(paramLine)) && m[0]) settings.push([m[1].trim(), m[2].trim().replace(/^"|"$/g, '')]);
  const model = settings.find(s => s[0] === 'Model')?.[1] || '';
  return { positive: pos.join('\n').trim(), negative: neg.join('\n').trim(), chars: [], settings, extra: [], model };
}

function parseComfy(p) {
  const node = id => p[id];
  const textOf = (id, depth = 0) => {
    const n = node(id);
    if (!n || depth > 8) return null;
    for (const k of ['text', 'text_g', 'prompt', 'positive_prompt', 'string']) if (typeof n.inputs?.[k] === 'string') return n.inputs[k];
    for (const v of Object.values(n.inputs || {})) if (Array.isArray(v) && typeof v[0] !== 'object') { const r = textOf(v[0], depth + 1); if (r != null) return r; }
    return null;
  };
  const ks = Object.values(p).find(n => /KSampler|SamplerCustom/i.test(n.class_type || ''));
  const settings = [];
  const ckpt = Object.values(p).find(n => n.inputs?.ckpt_name || n.inputs?.unet_name);
  if (ckpt) settings.push(['모델', ckpt.inputs.ckpt_name || ckpt.inputs.unet_name]);
  if (ks) for (const k of ['seed', 'noise_seed', 'steps', 'cfg', 'sampler_name', 'scheduler', 'denoise'])
    if (ks.inputs?.[k] !== undefined && !Array.isArray(ks.inputs[k])) settings.push([k, String(ks.inputs[k])]);
  return {
    positive: ks && Array.isArray(ks.inputs?.positive) ? textOf(ks.inputs.positive[0]) || '' : '',
    negative: ks && Array.isArray(ks.inputs?.negative) ? textOf(ks.inputs.negative[0]) || '' : '',
    chars: [], settings, extra: [], model: settings[0]?.[1] || '',
  };
}

/* ---------- 렌더링 ---------- */
const state = { items: [], current: -1, tagView: false };
const CHAR_COLORS = ['#8b5cf6', '#0891b2', '#db2777', '#65a30d', '#ea580c', '#2563eb'];
const GEN_LABEL = { nai: 'NovelAI', a1111: 'Stable Diffusion WebUI', comfy: 'ComfyUI' };

/* ---------- 프롬프트 해석 ----------
   NAI 가중치 그룹(3::태그1, 태그2::), 괄호 강조({ } [ ] ( ))가 쉼표를 넘어 여러 태그를 감싸도
   그룹 단위로 묶어서 읽음 */
const WEIGHT_RE = /^-?\d+(?:\.\d+)?::/;
const BR_OPEN = { '{': '}', '[': ']', '(': ')' }, BR_CLOSE = { '}': '{', ']': '[', ')': '(' };
const wClass = w => w < 0 ? 'minus' : w > 1 ? 'up' : w < 1 ? 'down' : '';
const isWeightStart = (src, i) => !/[\w.]/.test(src[i - 1] || '') && WEIGHT_RE.exec(src.slice(i, i + 24));

function parsePrompt(src) {
  const root = { items: [] }, stack = [root];
  let buf = '';
  const lit = { '(': 0, '[': 0, '{': 0 }; // 태그 중간에 나온 괄호 (예: nahida (genshin impact))
  const top = () => stack[stack.length - 1];
  const flush = () => { const t = buf.trim(); if (t) top().items.push({ type: 'tag', text: t }); buf = ''; lit['('] = lit['['] = lit['{'] = 0; };
  const close = end => { const g = stack.pop(); g.raw = src.slice(g.start, end).trim(); };
  const weightIdx = () => stack.findIndex(g => g.kind === 'w');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (ch === '\\' && i + 1 < src.length) { buf += ch + src[++i]; continue; }
    const wm = isWeightStart(src, i);
    if (wm) {
      flush();
      const wi = weightIdx(); // NAI 가중치 그룹은 중첩되지 않음: 열려 있던 그룹은 여기서 끝남
      if (wi > 0) while (stack.length > wi) close(i);
      const g = { type: 'group', kind: 'w', weight: parseFloat(wm[0]), items: [], start: i };
      top().items.push(g); stack.push(g); i += wm[0].length - 1; continue;
    }
    if (ch === ':' && src[i + 1] === ':') {
      const wi = weightIdx();
      if (wi > 0) { flush(); while (stack.length > wi + 1) close(i); close(i + 2); }
      else buf += '::';
      i++; continue;
    }
    if (BR_OPEN[ch] && buf.trim()) { lit[ch]++; buf += ch; continue; }
    if (BR_CLOSE[ch] && lit[BR_CLOSE[ch]] > 0) { lit[BR_CLOSE[ch]]--; buf += ch; continue; }
    if (BR_OPEN[ch]) { flush(); const g = { type: 'group', kind: ch, items: [], start: i }; top().items.push(g); stack.push(g); continue; }
    if (BR_CLOSE[ch]) {
      let k = stack.length - 1;
      while (k > 0 && stack[k].kind !== BR_CLOSE[ch]) k--;
      if (k > 0) { flush(); while (stack.length > k + 1) close(i); close(i + 1); continue; }
    }
    if (ch === ',' || ch === '\n' || ch === '|') { flush(); continue; }
    buf += ch;
  }
  flush();
  while (stack.length > 1) close(src.length);
  return root.items;
}
const countTags = items => items.reduce((n, it) => n + (it.type === 'tag' ? 1 : countTags(it.items)), 0);

/* 텍스트 보기: 가중치 기호에 색, 가중치 그룹 범위에 배경 */
function hl(src) {
  let out = '', open = false, last = 0, m;
  const lit = { '(': 0, '[': 0, '{': 0 };
  // 태그 중간에 나온 괄호인지: 앞의 공백이 아닌 글자가 구분자/괄호가 아니면 글자 그대로
  const midTag = i => { while (i > 0 && /\s/.test(src[i - 1])) i--; return i > 0 && !/[,|\n{}\[\]():]/.test(src[i - 1]); };
  const re = /(\\.)|(-?\d+(?:\.\d+)?::)|(::)|([{}\[\]()])/g;
  while ((m = re.exec(src))) {
    out += markQ(esc(src.slice(last, m.index))); last = re.lastIndex;
    if (m[1]) out += esc(m[1]);
    else if (m[2]) {
      if (/[\w.]/.test(src[m.index - 1] || '')) { out += esc(m[2]); continue; }
      if (open) out += '</span>';
      out += `<span class="rw ${wClass(parseFloat(m[2]))}"><span class="hw">${esc(m[2])}</span>`; open = true;
    } else if (m[3]) { out += '<span class="hw">::</span>'; if (open) { out += '</span>'; open = false; } }
    else if (BR_OPEN[m[4]] && midTag(m.index)) { lit[m[4]]++; out += esc(m[4]); }
    else if (BR_CLOSE[m[4]] && lit[BR_CLOSE[m[4]]] > 0) { lit[BR_CLOSE[m[4]]]--; out += esc(m[4]); }
    else out += `<span class="hb">${esc(m[4])}</span>`;
  }
  return out + markQ(esc(src.slice(last))) + (open ? '</span>' : '');
}

/* 태그 보기 */
function groupInfo(g) {
  // {{{a, b}}} 처럼 같은 괄호가 겹친 경우 한 그룹으로 펼침
  let depth = 1, inner = g;
  while (inner.kind !== 'w' && inner.items.length === 1 && inner.items[0].type === 'group' && inner.items[0].kind === inner.kind) { inner = inner.items[0]; depth++; }
  let label, cls;
  if (g.kind === 'w') { label = `${g.weight}×`; cls = wClass(g.weight); }
  else {
    const close = BR_OPEN[g.kind];
    label = depth <= 3 ? g.kind.repeat(depth) + ' ' + close.repeat(depth) : `${g.kind}${close}×${depth}`;
    const aw = g.kind === '(' && inner.items.length === 1 && inner.items[0].type === 'tag' && inner.items[0].text.match(/:(-?\d+(?:\.\d+)?)$/);
    cls = aw ? wClass(+aw[1]) : g.kind === '[' ? 'down' : 'up';
  }
  return { inner, label, cls };
}
function chipsHTML(items) {
  return items.map(it => {
    if (it.type === 'tag') return `<button class="chip ${isHit(it.text) ? 'hit' : ''}" data-copy="${clip(it.text)}" title="클릭하여 복사">${hl(it.text)}</button>`;
    const { inner, label, cls } = groupInfo(it);
    if (inner.items.length === 1 && inner.items[0].type === 'tag')
      return `<button class="chip ${cls} ${isHit(inner.items[0].text) ? 'hit' : ''}" data-copy="${clip(it.raw)}" title="클릭하여 복사">${hl(it.raw)}</button>`;
    const n = countTags(inner.items);
    return `<span class="grp ${cls}"><button class="glabel" data-copy="${clip(it.raw)}" title="태그 ${n}개 묶음 · 클릭하면 그룹 전체 복사">${esc(label)}</button>${chipsHTML(inner.items)}</span>`;
  }).join('');
}

function promptBody(text) {
  if (!text || !text.trim()) return '<p class="empty-note">없음</p>';
  if (!state.tagView) return `<div class="ptext">${hl(text)}</div>`;
  return `<div class="chips">${chipsHTML(parsePrompt(text))}</div>`;
}

function promptCard(title, text, kind) {
  const has = text && text.trim();
  return `<section class="card prompt ${kind}">

const tagChip = (t, cls, title) => `<button class="chip ${cls}" data-add="${addRef(title, [t])}" title="클릭하면 태그 합성에 담깁니다">${esc(t.text)}${t.w !== 1 ? `<span class="cw">×${fmtW(t.w)}</span>` : ''}</button>`;
function diffSection(title, ta, tb) {
  if (!ta.length && !tb.length) return '';

  const tools = list => `<button class="btn sm" data-add="${addRef(title, list)}">모두 담기</button><button class="btn sm" data-copy="${clip(list.map(t => t.text).join(', '))}">복사</button>`;
  const row = (label, cls, list, chip, all) => !list.length ? '' : `<div class="drow ${cls}">
    <div class="dlabel">${label} <span class="dn">${list.length}개</span>${all ? tools(all) : ''}</div>

    ${row('B에만 있음', 'add', d.onlyB, t => tagChip(t, 'add', title), d.onlyB)}

/* 태그 합성: 비교 화면에서 고른 태그와 직접 입력한 태그를 구역별로 모음 (B를 바꿔도 유지) */
const compose = []; // [{ title, tags: [{ key, text, w }] }]
const SEC_BASE = ['긍정 프롬프트', '부정 프롬프트'];
const secRank = t => { const i = SEC_BASE.indexOf(t); if (i >= 0) return i; const m = t.match(/캐릭터 (\d+) · (긍정|부정)/); return m ? 10 + m[1] * 2 + (m[2] === '부정') : 99; };
const findSec = title => compose.find(x => x.title === title);
const composeSd = () => ['a1111', 'comfy'].includes(state.compare?.a.result?.gen?.kind);
const fmtTag = (t, sd) => t.w === 1 ? t.text : sd ? `(${t.text}:${fmtW(t.w)})` : `${fmtW(t.w)}::${t.text}::`;
function addToCompose({ title, list }, focusSec) {
  let sec = findSec(title);
  if (!sec) compose.push(sec = { title, tags: [] });
  let added = 0;
  list.forEach(t => {
    const e = sec.tags.find(x => x.key === t.key);
    if (e) e.w = t.w; else { sec.tags.push({ key: t.key, text: t.text, w: t.w }); added++; }
  });
  toast(added ? `태그 ${added}개를 담았습니다` : '이미 담긴 태그입니다 (가중치만 맞췄습니다)');
  renderCompose(focusSec);
}
function composeHTML() {
  const sd = composeSd(), titles = new Set(SEC_BASE);
  compose.forEach(x => x.tags.length && titles.add(x.title));
  (state.compareTitles || []).forEach(t => titles.add(t));
  const secs = [...titles].sort((a, b) => secRank(a) - secRank(b)).map(t => findSec(t) || { title: t, tags: [] });
  const total = secs.reduce((n, x) => n + x.tags.length, 0);
  const all = secs.filter(x => x.tags.length).map(x => `[${x.title}]\n${x.tags.map(t => fmtTag(t, sd)).join(', ')}`).join('\n\n');
  return `<div class="card-head"><h3>태그 합성</h3><span class="count">${total}개</span>
      ${total ? `<button class="btn sm" data-copy="${clip(all)}">전체 복사</button><button class="btn sm" id="composeClear">비우기</button>` : ''}</div>
    ${total ? '' : '<p class="empty-note">비교 결과의 태그를 클릭하면 여기에 담깁니다. B를 바꿔 가며 여러 이미지에서 모을 수 있고, 각 칸에 태그를 직접 입력할 수도 있습니다.</p>'}
    ${secs.map(x => `<div class="csec">
      <div class="dlabel">${esc(x.title)} <span class="dn">${x.tags.length}개</span>${x.tags.length ? `<button class="btn sm" data-copy="${clip(x.tags.map(t => fmtTag(t, sd)).join(', '))}">복사</button>` : ''}</div>
      ${x.tags.length ? `<div class="chips">${x.tags.map((t, i) => `<span class="chip ctag">${esc(t.text)}${t.w !== 1 ? `<span class="cw">×${fmtW(t.w)}</span>` : ''}<button class="x" data-rm="${esc(x.title)}|${i}" aria-label="${esc(t.text)} 빼기" title="빼기">×</button></span>`).join('')}</div>` : ''}
      <input class="cin" data-sec="${esc(x.title)}" placeholder="태그 직접 입력 · 쉼표로 여러 개 · Enter" autocomplete="off" spellcheck="false" aria-label="${esc(x.title)}에 태그 직접 입력">
    </div>`).join('')}`;
}
function renderCompose(focusSec) {
  const el = $('#compose');

function settingsDiff(ga, gb) {
  const A = new Map(ga.settings.map(s => [s[0], s[1]])), B = new Map(gb.settings.map(s => [s[0], s[1]]));
  if (ga.refs || gb.refs) { A.set('레퍼런스', refText(ga) || '–'); B.set('레퍼런스', refText(gb) || '–'); }
  const keys = [...new Set([...A.keys(), ...B.keys()])].filter(k => k !== '생성 소요 시간');
  if (!keys.length) return '';
  const diff = keys.filter(k => A.get(k) !== B.get(k));
  return `<section class="card"><div class="card-head"><h3>생성 설정</h3><span class="count">${diff.length ? `다른 항목 ${diff.length}개 · 같은 항목 ${keys.length - diff.length}개` : '모두 같음'}</span></div>
    ${diff.length ? `<table class="dtable"><tr><th></th><th>A</th><th>B</th></tr>${diff.map(k => `<tr><th>${esc(k)}</th><td>${esc(A.get(k) ?? '–')}</td><td>${esc(B.get(k) ?? '–')}</td></tr>`).join('')}</table>` : ''}</section>`;
}
function renderCompare() {
  const { a, b } = state.compare, ga = a.result?.gen, gb = b.result?.gen;
  adds = [];
  const side = (it, ab) => `<div class="cside ${ab}"><div class="cimg ${noMeta(it) ? 'nometa' : ''}"><img src="${it.url}" alt="" data-cmpview="${ab}" title="클릭하면 확대해서 봅니다"></div><span class="ab">${ab.toUpperCase()}</span>
    <div class="cname">${esc(it.path || it.file.name)}${!it.result ? ' · 분석 중' : noMeta(it) ? ' · <b class="nm">메타데이터 없음</b>' : ''}</div></div>`;
  let body = '';
  const titles = [];
  if (!a.result || !b.result) body = '<div class="loading">분석 중…</div>';
  else if (!ga || !gb) body = `<div class="notice"><b>${!ga && !gb ? '두 이미지 모두' : !ga ? 'A 이미지에' : 'B 이미지에'} 생성 정보가 없어서 태그를 비교할 수 없습니다.</b></div>`;
  else {
    const sec = (title, ta, tb) => { titles.push(title); body += diffSection(title, ta, tb); };
    sec('긍정 프롬프트', flatTags(ga.positive, ga.kind), flatTags(gb.positive, gb.kind));
    sec('부정 프롬프트', flatTags(ga.negative, ga.kind), flatTags(gb.negative, gb.kind));
    const n = Math.max(ga.chars?.length || 0, gb.chars?.length || 0);
    for (let i = 0; i < n; i++) {
      const ca = ga.chars?.[i] || {}, cb = gb.chars?.[i] || {};
      sec(`캐릭터 ${i + 1} · 긍정`, flatTags(ca.positive, ga.kind), flatTags(cb.positive, gb.kind));
      sec(`캐릭터 ${i + 1} · 부정`, flatTags(ca.negative, ga.kind), flatTags(cb.negative, gb.kind));
    }
    body += settingsDiff(ga, gb);

  state.compareTitles = titles;
  return `<div class="cmp">
    <div class="chead">${side(a, 'a')}<button class="btn" id="cmpSwap" title="A와 B 바꾸기">⇄</button>${side(b, 'b')}</div>
    <div class="cbar"><span>A가 기준입니다. 썸네일을 클릭하거나 ← → 키로 B(비교 대상)를 바꿉니다. 태그를 클릭하면 태그 합성 칸에 담깁니다.</span><button class="btn sm" id="cmpExit">비교 끝내기</button></div>
    <div class="cgrid"><div class="stack">${body}</div><aside class="card compose" id="compose">${composeHTML()}</aside></div>

}

/* ---------- ZIP ---------- */
const IMG_EXT = /\.(png|jpe?g|webp|gif|avif)$/i;
const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif' };
const isZip = f => /\.zip$/i.test(f.name) || /zip/i.test(f.type);
const dosTime = (t, d) => new Date(1980 + (d >> 9), ((d >> 5) & 15) - 1, d & 31, t >> 11, (t >> 5) & 63, (t & 31) * 2).getTime();
// 파일 이름: UTF-8 표시가 없으면 UTF-8 → 한국어 윈도우(CP949) 순으로 시도
function zipName(bytes, utf8Flag) {
  if (utf8Flag) return utf8(bytes);
  try { return utf8(bytes, true); } catch {}
  try { return new TextDecoder('euc-kr').decode(bytes); } catch { return latin1(bytes); }
}
async function unzipImages(file) {
  const u8 = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(u8.buffer);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('올바른 ZIP 파일이 아닙니다');
  let count = dv.getUint16(eocd + 10, true), cdOff = dv.getUint32(eocd + 16, true);
  if ((cdOff === 0xFFFFFFFF || count === 0xFFFF) && eocd >= 20 && dv.getUint32(eocd - 20, true) === 0x07064b50) {
    const z64 = Number(dv.getBigUint64(eocd - 12, true));
    count = Number(dv.getBigUint64(z64 + 32, true)); cdOff = Number(dv.getBigUint64(z64 + 48, true));
  }
  const images = [];
  let skipped = 0, encrypted = 0, p = cdOff;
  for (let n = 0; n < count && p + 46 <= u8.length && dv.getUint32(p, true) === 0x02014b50; n++) {
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const time = dv.getUint16(p + 12, true), date = dv.getUint16(p + 14, true);
    let csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true), lho = dv.getUint32(p + 42, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    let name = zipName(u8.subarray(p + 46, p + 46 + nl), flags & 0x800);
    for (let e = p + 46 + nl, end = e + el; e + 4 <= end;) {
      const id = dv.getUint16(e, true), sz = dv.getUint16(e + 2, true);
      if (id === 0x0001) { // ZIP64 크기/위치
        let q = e + 4;
        if (usize === 0xFFFFFFFF) { usize = Number(dv.getBigUint64(q, true)); q += 8; }
        if (csize === 0xFFFFFFFF) { csize = Number(dv.getBigUint64(q, true)); q += 8; }
        if (lho === 0xFFFFFFFF) lho = Number(dv.getBigUint64(q, true));
      } else if (id === 0x7075 && sz > 5) name = utf8(u8.subarray(e + 9, e + 4 + sz)); // 유니코드 경로
      e += 4 + sz;
    }
    p += 46 + nl + el + cl;
    const base = name.split('/').pop();
    if (name.endsWith('/') || !IMG_EXT.test(base) || name.startsWith('__MACOSX/') || base.startsWith('._')) continue;
    if (flags & 1) { encrypted++; continue; }
    if (dv.getUint32(lho, true) !== 0x04034b50) { skipped++; continue; }
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    let data = u8.subarray(start, start + csize);
    try {
      if (method === 8) data = await inflate(data, 'deflate-raw');
      else if (method !== 0) { skipped++; continue; }
    } catch { skipped++; continue; }
    const type = MIME[base.split('.').pop().toLowerCase()] || '';
    images.push({ file: new File([data], base, { type, lastModified: dosTime(time, date) }), path: name });
  }
  return { images, skipped, encrypted };
}

/* ---------- 파일 입력 ---------- */
async function addFiles(files) {
  const list = [];
  const zipNotes = [];
  for (const f of Array.from(files)) {
    if (isZip(f)) {
      toast(`${f.name} 압축을 푸는 중…`, 60000);
      try {
        const z = await unzipImages(f);
        z.images.forEach(x => list.push({ file: x.file, zip: f.name, path: x.path }));
        zipNotes.push(`${f.name}: 이미지 ${z.images.length}장`
          + (z.encrypted ? ` · 암호 걸린 파일 ${z.encrypted}개 제외` : '') + (z.skipped ? ` · 풀 수 없는 파일 ${z.skipped}개 제외` : ''));
      } catch (e) { zipNotes.push(`${f.name}: ${e.message}`); }
    } else if (f.type.startsWith('image/') || IMG_EXT.test(f.name)) list.push({ file: f });
  }
  if (zipNotes.length) toast(zipNotes.join(' / '), 3500);
  if (!list.length) { if (!zipNotes.length) toast('이미지 파일이 아닙니다'); return; }
  // 선택한 정렬 방식대로 전체 목록을 다시 배치하고, 새로 넣은 것 중 가장 왼쪽 이미지를 보여 줌
  const added = list.map(x => ({ ...x, url: URL.createObjectURL(x.file), result: null }));
  state.items.push(...added);
  state.items.sort(SORTS[state.sort]);
  added.sort((a, b) => state.items.indexOf(a) - state.items.indexOf(b));
  state.current = state.items.indexOf(added[0]);
  renderStrip();
  render();
  if (viewer.open) viewer.load();
  for (const it of added) {
    try { it.result = await analyze(it.file); }
    catch (e) { it.result = { format: '?', width: 0, height: 0, texts: [], chunks: [], errors: [e.message], gen: null }; }
    const i = state.items.indexOf(it);
    if (i < 0) return; // 분석 중에 "모두 지우기"를 누른 경우
    updateThumb(i);
    if (filtering() || state.stats.open) markActive();
    if (i === state.current || (state.compare && (it === state.compare.a || it === state.compare.b))) render();
  }
}

/* ---------- 확대 보기 ---------- */
const viewer = (() => {
  const box = $('#viewer'), stage = $('#vStage'), img = $('#vImg');
  let s = 1, tx = 0, ty = 0, fitS = 1;
  const apply = () => {
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    img.classList.toggle('px', s >= 3);
    $('#vZoom').textContent = Math.round(s * 100) + '%';
  };
  const center = () => { const r = stage.getBoundingClientRect(); tx = (r.width - img.naturalWidth * s) / 2; ty = (r.height - img.naturalHeight * s) / 2; };
  const fit = () => {
    const r = stage.getBoundingClientRect();
    if (!img.naturalWidth) return;
    fitS = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
    s = fitS; center(); apply();
  };
  const zoomAt = (ns, mx, my) => {
    ns = Math.max(0.05, Math.min(32, ns));
    tx = mx - (mx - tx) * ns / s; ty = my - (my - ty) * ns / s; s = ns; apply();
  };
  const zoomCenter = f => { const r = stage.getBoundingClientRect(); zoomAt(s * f, r.width / 2, r.height / 2); };
  const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  img.addEventListener('load', fit);
  stage.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e); zoomAt(s * Math.exp(-e.deltaY * 0.0015), x, y); }, { passive: false });
  stage.addEventListener('dblclick', e => {
    if (e.target.closest('.vnav')) return;
    const [x, y] = local(e);
    if (Math.abs(s - fitS) < 0.01) zoomAt(fitS < 1 ? 1 : fitS * 2, x, y); else fit();
  });

  // 끌어서 이동 + 두 손가락 확대
  const ptrs = new Map();
  let pinch = null;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.vnav')) return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    stage.classList.add('drag');
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s }; }
  });
  stage.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], r = stage.getBoundingClientRect();
      zoomAt(pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    } else if (ptrs.size === 1) { tx += e.clientX - prev[0]; ty += e.clientY - prev[1]; apply(); }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) stage.classList.remove('drag'); };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  window.addEventListener('resize', () => { if (!box.hidden) fit(); });

  box.addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    const v = b.dataset.v;
    if (v === 'in') zoomCenter(1.25);
    else if (v === 'out') zoomCenter(0.8);
    else if (v === 'fit') fit();
    else if (v === 'one') { s = 1; center(); apply(); }
    else if (v === 'prev') api.nav(-1);
    else if (v === 'next') api.nav(1);
    else if (v === 'close') api.close();
  });

  let cur = null; // 비교 화면에서 연 이미지 (A 또는 B)
  const api = {
    get open() { return !box.hidden; },
    load() {
      const c = state.compare, ab = c && cur;
      const it = cur || state.items[state.current];
      if (!it) return api.close();
      $('#vName').textContent = ab ? `${cur === c.a ? 'A' : 'B'} · ${it.path || it.file.name}` : `${state.current + 1} / ${state.items.length} · ${it.file.name}`;
      box.querySelector('.prev').disabled = ab ? cur === c.a : step(state.current, -1) < 0;
      box.querySelector('.next').disabled = ab ? cur === c.b : step(state.current, 1) < 0;
      if (img.src !== it.url) img.src = it.url; else fit();
    },
    nav(dir) {
      const c = state.compare;
      if (c && cur) { cur = dir < 0 ? c.a : c.b; api.load(); } else go(dir);
    },
    show(it) { cur = it || null; box.hidden = false; document.body.style.overflow = 'hidden'; api.load(); },
    close() { cur = null; box.hidden = true; document.body.style.overflow = ''; },
    key(e) {
      if (e.key === 'Escape') api.close();
      else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.compare && cur) api.nav(e.key === 'ArrowLeft' ? -1 : 1);
      else if (e.key === '+' || e.key === '=') zoomCenter(1.25);
      else if (e.key === '-') zoomCenter(0.8);
      else if (e.key === '0') fit();
      else if (e.key === '1') { s = 1; center(); apply(); }
      else return false;
      return true;
    },
  };
  return api;
})();

/* 썸네일 크기 조절: 아래 손잡이를 끌어 내리면 커짐 */
const THUMB_MIN = 48, THUMB_MAX = 360;
function setThumb(px) {
  px = Math.round(Math.max(THUMB_MIN, Math.min(THUMB_MAX, px)));
  document.documentElement.style.setProperty('--thumb', px + 'px');
  return px;
}
let thumbSize = 64;
const handle = $('#stripHandle');
handle.addEventListener('pointerdown', e => {
  e.preventDefault();
  handle.setPointerCapture(e.pointerId);
  handle.classList.add('dragging');
  const y0 = e.clientY, s0 = thumbSize;
  const move = ev => { thumbSize = setThumb(s0 + ev.clientY - y0); };
  const up = () => {
    handle.classList.remove('dragging');
    handle.removeEventListener('pointermove', move);
    handle.removeEventListener('pointerup', up);
    handle.removeEventListener('pointercancel', up);
    try { localStorage.setItem('imv-thumb', thumbSize); } catch {}
    markActive();
  };
  handle.addEventListener('pointermove', move);
  handle.addEventListener('pointerup', up);
  handle.addEventListener('pointercancel', up);
});
handle.addEventListener('dblclick', () => { thumbSize = setThumb(64); try { localStorage.setItem('imv-thumb', thumbSize); } catch {} });

/* 썸네일 줄에서 마우스 휠을 가로 스크롤로 */
$('#strip').addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) { e.preventDefault(); $('#strip').scrollLeft += e.deltaY; }
}, { passive: false });

/* ---------- 즐겨찾기 (이 브라우저에 저장) ---------- */
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('imv-fav') || '[]')); } catch {}
function toggleFav(it) {
  const id = itemId(it), on = !favs.has(id);
  on ? favs.add(id) : favs.delete(id);
  try { localStorage.setItem('imv-fav', JSON.stringify([...favs].slice(-3000))); } catch {}
  updateThumb(state.items.indexOf(it));
  toast(on ? '즐겨찾기에 추가했습니다' : '즐겨찾기를 해제했습니다');
  if (state.favOnly) applySearch(); else { markActive(); if (!state.compare) render(); }
}
$('#btnFavOnly').onclick = () => {
  state.favOnly = !state.favOnly;
  $('#btnFavOnly').setAttribute('aria-pressed', state.favOnly);
  applySearch();
};

/* ---------- 태그 통계 ---------- */
state.stats = { open: false, scope: 'pos', all: false };
function renderStats() {
  const el = $('#statsPanel');
  el.hidden = !state.stats.open;
  if (!state.stats.open) return;
  const pool = state.items.filter(it => it.result?.gen && matches(it)), cnt = new Map();
  pool.forEach(it => { const t = itemTags(it); new Set(state.stats.scope === 'neg' ? t.neg : t.pos).forEach(k => cnt.set(k, (cnt.get(k) || 0) + 1)); });
  const sorted = [...cnt].sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]));
  const shown = state.stats.all ? sorted : sorted.slice(0, 40), on = new Set(state.q.inc);
  el.innerHTML = `<div class="stats-head">
      <b>태그 통계</b><span>${filtering() ? '검색 결과 ' : ''}${pool.length}장 기준 · ${sorted.length}종</span>
      <span class="seg"><button class="btn sm" data-sscope="pos" aria-pressed="${state.stats.scope === 'pos'}">긍정</button><button class="btn sm" data-sscope="neg" aria-pressed="${state.stats.scope === 'neg'}">부정</button></span>
      ${sorted.length > 40 ? `<button class="btn sm" id="statsMore">${state.stats.all ? '접기' : `모두 보기 (${sorted.length})`}</button>` : ''}
      <span class="stats-hint">태그를 클릭하면 검색에 추가되고, 다시 클릭하면 빠집니다 · 막대는 사용 비율</span>
    </div>
    <div class="stats-chips chips">${shown.length ? shown.map(([k, n]) => `<button class="chip stat ${on.has(k) ? 'on' : ''}" data-stat="${esc(k)}" style="--p:${Math.round(n / pool.length * 100)}%" title="${pool.length}장 중 ${n}장">${esc(k)}<span class="sn">${n}</span></button>`).join('') : '<p class="empty-note">통계를 낼 생성 정보가 없습니다</p>'}</div>`;
}
function toggleTerm(k) {
  const terms = $('#q').value.split(',').map(x => x.trim()).filter(Boolean);
  const i = terms.findIndex(t => normTag(t) === k);
  i >= 0 ? terms.splice(i, 1) : terms.push(k);
  $('#q').value = terms.join(', ');
  $('#q').dispatchEvent(new Event('input'));
}
$('#btnStats').onclick = () => {
  state.stats.open = !state.stats.open;
  $('#btnStats').setAttribute('aria-pressed', state.stats.open);
  renderStats();
};

/* ---------- 내보내기 (CSV · TXT) ---------- */
const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
function settingsOf(g) {
  const out = {};
  (g?.settings || []).forEach(([k, v]) => { const key = SLABEL[k]; if (key && !(key in out)) out[key] = v; });
  return out;
}
function exportCSV(items) {
  const maxChars = Math.max(0, ...items.map(it => it.result.gen?.chars?.length || 0));
  const head = ['번호', '파일명', '압축 파일', '즐겨찾기', '생성 도구', '모델', '긍정 프롬프트', '부정 프롬프트'];
  for (let i = 1; i <= maxChars; i++) head.push(`캐릭터 ${i} 긍정`, `캐릭터 ${i} 부정`);
  head.push('시드', '스텝', '가이던스', '샘플러', '해상도', 'Effort', '레퍼런스');
  const rows = items.map(it => {
    const g = it.result.gen, st = settingsOf(g);
    const r = [state.items.indexOf(it) + 1, it.path || it.file.name, it.zip || '', isFav(it) ? '★' : '', g ? GEN_LABEL[g.kind] : '메타데이터 없음', g?.model || '', g?.positive || '', g?.negative || ''];
    for (let i = 0; i < maxChars; i++) r.push(g?.chars?.[i]?.positive || '', g?.chars?.[i]?.negative || '');
    r.push(st.seed ?? '', st.steps ?? '', st.scale ?? '', st.sampler ?? '', st.size ?? '', st.effort ?? '', refText(g));
    return r;
  });
  return '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
function exportText(items) {
  return items.map(it => {
    const g = it.result.gen, lines = [`=== ${state.items.indexOf(it) + 1}. ${it.path || it.file.name}${isFav(it) ? ' ★' : ''} ===`];
    if (!g) return lines.concat('(메타데이터 없음)').join('\n');
    lines.push(`도구: ${GEN_LABEL[g.kind]}${g.model ? ' · ' + g.model : ''}`);
    const st = g.settings.filter(([k]) => k !== '모델' && k !== 'Model').map(([k, v]) => `${k} ${v}`).join(' · ');
    if (st) lines.push(`설정: ${st}`);
    if (g.refs) lines.push(`레퍼런스: ${refText(g)}`);
    lines.push('', '[긍정]', g.positive || '', '', '[부정]', g.negative || '');
    (g.chars || []).forEach((c, i) => lines.push('', `[캐릭터 ${i + 1} 긍정]`, c.positive || '', `[캐릭터 ${i + 1} 부정]`, c.negative || ''));
    return lines.join('\n');
  }).join('\n\n');
}
function saveFile(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`${name} 저장`);
}
function doExport(kind) {
  $('#expMenu').open = false;
  const items = state.items.filter(it => it.result && matches(it));
  if (!items.length) { toast('내보낼 이미지가 없습니다'); return; }
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  if (kind === 'csv') saveFile(`nai-meta-${stamp}.csv`, exportCSV(items), 'text/csv;charset=utf-8');
  else if (kind === 'txt') saveFile(`nai-meta-${stamp}.txt`, exportText(items), 'text/plain;charset=utf-8');
  else copyText(exportText(items));
}
$('#expMenu').addEventListener('toggle', () => {
  if (!$('#expMenu').open) return;
  const n = state.items.filter(it => it.result && matches(it)).length;
  $('#expNote').textContent = filtering() ? `검색 결과 ${n}장을 내보냅니다` : `열어 둔 ${n}장을 모두 내보냅니다`;
});

/* ---------- 썸네일 미리보기 말풍선 (마우스) ---------- */
const tip = $('#tip');
let tipTimer;
function showTip(t) {
  const it = state.items[+t.dataset.idx];
  if (!it || !t.isConnected) return;
  const g = it.result?.gen, cut = (x, n) => x.length > n ? x.slice(0, n) + '…' : x;
  tip.innerHTML = `<b>${esc(it.path || it.file.name)}</b>${isFav(it) ? ' ★' : ''}` + (!it.result ? '<p class="tk">분석 중…</p>' : !g ? '<p class="tnm">메타데이터 없음</p>' :
    `<p class="tk">${esc(GEN_LABEL[g.kind])}${g.model ? ' · ' + esc(g.model) : ''}${g.refs && refList(g.refs).length ? ' · 레퍼런스: ' + esc(refText(g)) : ''}</p>
     <p><span class="tl p">긍정</span>${hl(cut(g.positive || '', 260))}</p>
     ${g.negative ? `<p><span class="tl n">부정</span>${hl(cut(g.negative, 120))}</p>` : ''}
     ${g.chars?.length ? `<p class="tk">캐릭터 ${g.chars.length}명 · ${esc(g.chars.map(c => cut(c.positive || '', 36)).join(' / '))}</p>` : ''}`);
  tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
  tip.style.top = (r.bottom + 8 + h < innerHeight ? r.bottom + 8 : Math.max(8, r.top - h - 8)) + 'px';
}
$('#strip').addEventListener('pointerover', e => {
  const t = e.target.closest('.thumb');
  if (!t || e.pointerType !== 'mouse') return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => showTip(t), 350);
});
$('#strip').addEventListener('pointerout', e => {
  const t = e.target.closest('.thumb');
  if (t && !t.contains(e.relatedTarget)) { clearTimeout(tipTimer); tip.hidden = true; }
});
$('#strip').addEventListener('scroll', () => { tip.hidden = true; });

/* 태그 합성: 칸에 직접 입력하고 Enter */
$('#main').addEventListener('keydown', e => {
  const c = e.target.closest('.cin');
  if (!c || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  const list = flatTags(c.value, composeSd() ? 'sd' : 'nai');
  if (!list.length) return;
  addToCompose({ title: c.dataset.sec, list }, c.dataset.sec);
});

/* ← → 방향키로 이전/다음 이미지 */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (viewer.open && viewer.key(e)) { e.preventDefault(); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === '/' && state.items.length > 1) { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape' && $('#expMenu').open) $('#expMenu').open = false;
  else if (e.key === 'Escape' && state.compare) endCompare();
  else if ((e.key === 'f' || e.key === 'F') && !state.compare && state.items[state.current]) toggleFav(state.items[state.current]);
});
$('#btnTags').onclick = () => {
  state.tagView = !state.tagView;
  $('#btnTags').setAttribute('aria-pressed', state.tagView);
  try { localStorage.setItem('imv-tagview', state.tagView ? '1' : '0'); } catch {}
  render();
};
$('#btnTheme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('imv-theme', root.dataset.theme); } catch {}
};

document.addEventListener('click', e => {
  if (!e.target.closest('#expMenu')) $('#expMenu').open = false;
  tip.hidden = true;
  const ad = e.target.closest('[data-add]');
  if (ad) { addToCompose(adds[+ad.dataset.add]); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) { const k = rm.dataset.rm.lastIndexOf('|'), sec = findSec(rm.dataset.rm.slice(0, k)); sec?.tags.splice(+rm.dataset.rm.slice(k + 1), 1); renderCompose(); return; }
  if (e.target.closest('#composeClear')) { compose.length = 0; renderCompose(); return; }
  const cv = e.target.closest('[data-cmpview]');
  if (cv && state.compare) { viewer.show(state.compare[cv.dataset.cmpview]); return; }
  const ex = e.target.closest('[data-exp]');
  if (ex) { doExport(ex.dataset.exp); return; }
  const sb = e.target.closest('[data-stat]');
  if (sb) { toggleTerm(sb.dataset.stat); return; }
  const ss = e.target.closest('[data-sscope]');
  if (ss) { state.stats.scope = ss.dataset.sscope; renderStats(); return; }
  if (e.target.closest('#statsMore')) { state.stats.all = !state.stats.all; renderStats(); return; }
  if (e.target.closest('#favBtn')) { toggleFav(state.items[state.current]); return; }
  const c = e.target.closest('[data-copy]');
  if (c) { copyText(clips[+c.dataset.copy]); return; }
  const t = e.target.closest('.thumb');
  if (t) { state.compare ? setB(state.items[+t.dataset.idx]) : select(+t.dataset.idx); return; }
  if (e.target.closest('#cmpSwap')) { swapAB(); return; }
  if (e.target.closest('#cmpExit')) { endCompare(); return; }
  if (e.target.closest('#drop')) { $('#fileInput').click(); return; }
  if (e.target.id === 'previewImg') viewer.show();
});

let dragDepth = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragDepth++; $('#overlay').classList.add('show'); } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#overlay').classList.remove('show'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#overlay').classList.remove('show');
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});
window.addEventListener('paste', e => {
  const files = Array.from(e.clipboardData?.files || []);
  if (files.length) addFiles(files);
});

try {
  const th = localStorage.getItem('imv-theme'); if (th) document.documentElement.dataset.theme = th;
  if (localStorage.getItem('imv-tagview') === '1') { state.tagView = true; $('#btnTags').setAttribute('aria-pressed', 'true'); }
  const ts = +localStorage.getItem('imv-thumb'); if (ts) thumbSize = setThumb(ts);
  const so = localStorage.getItem('imv-sort'); if (SORTS[so]) { state.sort = so; $('#sortSel').value = so; }
} catch {}
render();
</script>
</body>
